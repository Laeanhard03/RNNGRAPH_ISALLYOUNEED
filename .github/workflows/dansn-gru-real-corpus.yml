name: DANSN-GRU real-corpus benchmark

on:
  workflow_dispatch:
    inputs:
      train_tokens:
        description: Maximum training tokens from WikiText-103
        required: true
        default: "50000"
        type: string
      validation_tokens:
        description: Maximum validation tokens
        required: true
        default: "10000"
        type: string
      test_tokens:
        description: Maximum test tokens
        required: true
        default: "10000"
        type: string
      seeds:
        description: Comma-separated random seeds
        required: true
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  real-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-recurrent.txt
            requirements-corpus.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-recurrent.txt -r requirements-corpus.txt pytest
      - name: Run offline tests
        run: python -m pytest -q experiments/dansn_conditioned_gru_gates/
      - name: Run WikiText-103 benchmark
        env:
          TRAIN_TOKENS: ${{ inputs.train_tokens }}
          VALIDATION_TOKENS: ${{ inputs.validation_tokens }}
          TEST_TOKENS: ${{ inputs.test_tokens }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          python -m experiments.dansn_conditioned_gru_gates.large_corpus_benchmark \
            --dataset wikitext103 \
            --train-tokens "$TRAIN_TOKENS" \
            --validation-tokens "$VALIDATION_TOKENS" \
            --test-tokens "$TEST_TOKENS" \
            --epochs 1 --seeds "$SEEDS" \
            --output benchmark-results/wikitext103_dggru.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: dansn-gru-wikitext103-results
          path: benchmark-results/wikitext103_dggru.json
          if-no-files-found: error
