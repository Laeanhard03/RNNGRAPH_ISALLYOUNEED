name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements-recurrent.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.py"
      - "requirements-recurrent.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-recurrent.txt
      - name: Compile source
        run: |
          python -m py_compile agi.py recurrent_graph.py persistent_dansn_rnn.py
          python -m py_compile test_agi.py test_recurrent_graph.py test_persistent_dansn_rnn.py test_delayed_relational_recall.py benchmark_continual_learning.py delayed_relational_recall.py memory_read_supervision.py test_memory_read_supervision.py
      - name: Test canonical DANSN
        run: python test_agi.py
      - name: Test earlier recurrent adapter
        run: python test_recurrent_graph.py
      - name: Test persistent online memory adapter
        run: python test_persistent_dansn_rnn.py
      - name: Smoke-test multi-seed continual-learning comparison
        run: python benchmark_continual_learning.py --epochs 1 --seeds 7,13,21 --output benchmark-ci-results.json
      - name: Upload benchmark smoke result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-result
          path: benchmark-ci-results.json
          if-no-files-found: error
      - name: Test delayed relational recall task
        run: python test_delayed_relational_recall.py
      - name: Smoke-test delayed relational recall benchmark
        run: python delayed_relational_recall.py --subjects 24 --distractors 24 --delays 0,8,24 --epochs 3 --hidden-size 32 --window-size 9 --graph-depth 8 --chunk-size 16 --seeds 7,13,21 --output delayed-recall-ci-results.json
      - name: Upload delayed recall smoke result
        uses: actions/upload-artifact@v4
        with:
          name: delayed-recall-smoke-result
          path: delayed-recall-ci-results.json
          if-no-files-found: error
      - name: Smoke-test interleaved relational recall and entity linking
        run: python delayed_relational_recall.py --subjects 12 --distractors 8 --interleave-facts 2 --delays 0,2 --epochs 1 --hidden-size 16 --window-size 9 --graph-depth 8 --chunk-size 16 --seeds 7,13,21 --output interleaved-relational-ci-results.json
      - name: Upload interleaved relational recall result
        uses: actions/upload-artifact@v4
        with:
          name: interleaved-relational-smoke-result
          path: interleaved-relational-ci-results.json
          if-no-files-found: error
      - name: Test memory-read supervised learning
        run: python test_memory_read_supervision.py
      - name: Smoke-test multi-seed memory-read supervision
        run: python memory_read_supervision.py --subjects 24 --distractors 24 --delays 0,8,24 --epochs 3 --hidden-size 32 --window-size 9 --graph-depth 8 --chunk-size 16 --seeds 7,13,21 --output memory-read-supervision-ci-results.json
      - name: Upload memory-read supervision result
        uses: actions/upload-artifact@v4
        with:
          name: memory-read-supervision-smoke-result
          path: memory-read-supervision-ci-results.json
          if-no-files-found: error
