name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-recurrent.txt
      - name: Compile source
        run: |
          python -m py_compile agi.py recurrent_graph.py persistent_dansn_rnn.py
          python -m py_compile test_agi.py test_recurrent_graph.py test_persistent_dansn_rnn.py
      - name: Test canonical DANSN
        run: python test_agi.py
      - name: Test earlier recurrent adapter
        run: python test_recurrent_graph.py
      - name: Test persistent online memory adapter
        run: python test_persistent_dansn_rnn.py
      - name: Smoke-test continual-learning comparison
        run: python benchmark_continual_learning.py --epochs 1 --output benchmark-ci-results.json
