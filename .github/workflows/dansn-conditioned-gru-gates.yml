name: DANSN-Conditioned GRU Gates

on:
  push:
    branches:
      - feature/dansn-conditioned-gru-gates
    paths:
      - "experiments/dansn_conditioned_gru_gates/**"
      - "persistent_dansn_rnn.py"
      - "agi.py"
      - "requirements-recurrent.txt"
      - ".github/workflows/dansn-conditioned-gru-gates.yml"
  pull_request:
    paths:
      - "experiments/dansn_conditioned_gru_gates/**"
      - "persistent_dansn_rnn.py"
      - "agi.py"
      - "requirements-recurrent.txt"
      - ".github/workflows/dansn-conditioned-gru-gates.yml"

jobs:
  tests-and-ablations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-recurrent.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-recurrent.txt pytest
      - name: Run DANSN-conditioned GRU and ablation tests
        run: python -m pytest -q experiments/dansn_conditioned_gru_gates/
      - name: Run three-seed gate ablations
        run: |
          mkdir -p benchmark-results
          python -m experiments.dansn_conditioned_gru_gates.ablation \
            --epochs 3 --seeds 7,13,21 --hidden-size 48 \
            --chunk-size 8 --window-size 8 \
            --output benchmark-results/dansn_gru_gate_ablations.json \
            > benchmark-results/benchmark-console.json
      - name: Write ablation summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("benchmark-results/dansn_gru_gate_ablations.json").read_text())
          systems = [
              ("plain_gru", "Plain GRU"),
              ("readout_fusion", "Readout-fusion DANSN-GRU"),
              ("reset_only", "DANSN in reset gate only"),
              ("update_only", "DANSN in update gate only"),
              ("full", "DANSN in reset + update + candidate"),
          ]
          lines = [
              "## DANSN GRU gate ablation pilot",
              "",
              "Seeds 7/13/21; three epochs; hidden width 48; same synthetic chronological stream.",
              "Static and adaptive perplexity are separate protocols. Lower is better.",
              "The three gate ablations have identical parameter counts by construction.",
              "",
              "| System | Static PPL (mean ± std) | Adaptive PPL (mean ± std) | Parameters |",
              "|---|---:|---:|---:|",
          ]
          for key, label in systems:
              item = data["summary"][key]
              static = item["static_perplexity"]
              adaptive = item["adaptive_perplexity"]
              params = item["parameter_count"]["mean"]
              lines.append(
                  f"| {label} | {static['mean']:.4f} ± {static['population_std']:.4f} "
                  f"| {adaptive['mean']:.4f} ± {adaptive['population_std']:.4f} "
                  f"| {params:.0f} |"
              )
          lines += [
              "",
              "### Gate diagnostics (mean activation)",
              "",
              "| Ablation | Reset gate | Update gate | Mean graph-readout norm |",
              "|---|---:|---:|---:|",
          ]
          for key, label in (
              ("reset_only", "Reset only"),
              ("update_only", "Update only"),
              ("full", "Full"),
          ):
              diag = data["summary"][key]["gate_diagnostics"]
              lines.append(
                  f"| {label} | {diag['reset_gate']['mean']['mean']:.4f} "
                  f"| {diag['update_gate']['mean']['mean']:.4f} "
                  f"| {diag['graph_readout_norm_mean']['mean']:.4f} |"
              )
          lines += [
              "",
              "Exploratory small synthetic pilot only; not evidence of general superiority.",
              "The raw artifact includes per-seed metrics, saturation, variance, and memory statistics.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Upload gate-ablation results
        uses: actions/upload-artifact@v4
        with:
          name: dansn-gru-gate-ablation-results
          path: benchmark-results/
          if-no-files-found: error
